name: 构建并发布 PHP 项目

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

permissions: write-all

concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 检出代码（拉取完整历史与 tag，用于生成更新日志）
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # 设置 PHP 环境
      - name: 设置 PHP 环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # 可根据 ThinkPHP 版本调整
          extensions: mbstring, curl, json, openssl, fileinfo
          tools: composer

      # 提前获取版本号，确保后续构建产物名称始终完整
      - name: 获取版本号
        run: |
          echo "VERSION=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"];')" >> "$GITHUB_ENV"
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> "$GITHUB_ENV"

      # 生成发布说明（自动从上一版本 tag 到当前的提交历史）
      - name: 生成更新内容
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## DeltaForce API v${{ env.VERSION }} 更新内容"
            echo ""
            git log --no-merges --pretty=format:"- %s" "$RANGE" || echo "- （无提交记录）"
            echo ""
            echo ""
            echo "---"
            echo "构建提交：${{ github.sha }}"
            echo "构建时间：${{ env.BUILDTIME }}"
          } > RELEASE_BODY.md
          echo "----- 生成的发布说明 -----"
          cat RELEASE_BODY.md

      # 缓存 Composer 依赖
      - name: 缓存 Composer 依赖
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # 安装 Composer 依赖
      - name: 安装依赖
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      # 创建构建产物
      - name: 创建构建产物
        run: |
          zip -r release-${{ env.VERSION }}-${{ github.run_id }}.zip . -x "runtime/*" ".git/*" ".github/*"

      # 列出打包文件
      - name: 列出打包文件
        run: unzip -l release-${{ env.VERSION }}-${{ github.run_id }}.zip

      # 上传构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: php-release-${{ env.VERSION }}-${{ github.run_id }}
          path: release-${{ env.VERSION }}-${{ github.run_id }}.zip

      # 创建 GitHub 发布
      - name: 创建 GitHub 发布
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: DeltaForce API v${{ env.VERSION }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: release-${{ env.VERSION }}-${{ github.run_id }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}